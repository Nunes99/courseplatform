<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Página não encontrada</title>
  <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script defer src="./config.js"></script>
  <script type="module">
    import { CoursePlatformApi } from './api.js';
    import { applyBrandFavicon } from './utils.js';

    const api = new CoursePlatformApi(window.COURSE_PLATFORM_CONFIG);
    api.publicMediaConfig()
      .then((response) => applyBrandFavicon(response.mediaConfig?.logoUrl || response.logoUrl || ''))
      .catch(() => applyBrandFavicon(localStorage.getItem('lssLogoUrl') || ''));
  </script>
</head>
<body>
  <main class="page-shell">
    <div class="completion-card standalone-card">
      <h1>Página não encontrada</h1>
      <a class="button button-primary" href="./">Abrir o curso</a>
    </div>
  </main>
</body>
</html>

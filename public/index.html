<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00365B">
  <meta name="description" content="Plataforma digital da LMTWEBNAIRS Summer School 2026.">
  <title>LMTWEBNAIRS Summer School</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script>
    (() => {
      const saved = localStorage.getItem('lssTheme');
      document.documentElement.dataset.theme = saved || 'light';
    })();
  </script>
  <link rel="stylesheet" href="./assets/css/styles.css">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-brand">
      <span class="site-brand-symbol">LSS</span>
      <span class="site-brand-copy">
        <strong>LMTWEBNAIRS</strong>
        <small>Summer School</small>
      </span>
    </div>

    <div class="site-header-actions">
      <button class="header-user" id="headerUser" type="button" hidden></button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar modo claro e escuro">
        <span class="theme-toggle-icon" aria-hidden="true">
          <img src="https://api.iconify.design/lucide/sun.svg?color=%2300365B" alt="">
        </span>
      </button>
      <button class="text-button" id="logoutButton" type="button" hidden>Sair</button>
      <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Abrir menu" aria-expanded="false" hidden>
        <img src="https://api.iconify.design/lucide/menu.svg?color=%2300365B" alt="">
      </button>
    </div>

    <nav class="mobile-menu" id="mobileMenu" hidden>
      <button type="button" data-mobile-route="#/">Visão geral</button>
      <button type="button" data-mobile-route="#/courses">Meus cursos</button>
      <button type="button" data-mobile-route="#/lessons">Aulas e módulos</button>
      <button type="button" data-mobile-route="#/submissions">Submissões</button>
      <button type="button" data-mobile-route="#/grades">Notas e feedback</button>
      <button type="button" data-mobile-route="#/certifications">Certificações</button>
      <button type="button" data-mobile-route="#/profile">Perfil</button>
      <button type="button" id="mobileThemeButton">Tema</button>
      <button type="button" class="mobile-menu-logout" id="mobileLogoutButton">Sair</button>
    </nav>
  </header>

  <main id="app" class="page-shell">
    <section class="auth-layout">
      <div class="auth-panel">
        <div class="auth-brand-row">
          <span class="brand-mark">LSS</span>
          <div>
            <p class="eyebrow">LMTWEBNAIRS Summer School</p>
            <h1 class="auth-title">A carregar plataforma</h1>
          </div>
        </div>
        <p class="auth-description">Estamos a preparar o painel.</p>
      </div>
    </section>
  </main>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
</body>
</html>

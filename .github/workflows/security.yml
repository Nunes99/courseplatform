name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install Python audit tools
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit --requirement requirements.txt --strict
      - name: Run Python security linter
        run: >-
          bandit --recursive backend api scripts
          --severity-level medium --confidence-level medium
          --baseline .bandit-baseline.json
      - name: Verify secret baseline
        run: python scripts/check_secrets.py
      - name: Install Node dependencies reproducibly
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit Node dependencies
        run: pnpm audit --audit-level=high

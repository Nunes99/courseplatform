name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Python audit tools
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit --requirement requirements.txt --strict
      - name: Run Python security linter
        run: |
          status=0
          bandit --recursive backend api scripts --format json --output bandit-current.json || status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          python scripts/check_bandit_baseline.py bandit-current.json
          rm -f bandit-current.json
      - name: Verify secret baseline
        run: python scripts/check_secrets.py
      - name: Install Node dependencies reproducibly
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit Node dependencies
        run: pnpm audit --audit-level=high

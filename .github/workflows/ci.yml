name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install browser QA dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile Python
        run: python -m compileall -q backend api scripts tests
      - name: Verify synchronized frontend copies
        run: pnpm run check:frontend
      - name: Run test suite
        run: python -m unittest discover -s tests -v

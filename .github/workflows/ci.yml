name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install browser QA dependencies
        run: npm ci
      - name: Compile Python
        run: python -m compileall -q backend api scripts tests
      - name: Verify synchronized frontend copies
        run: npm run check:frontend
      - name: Run test suite
        run: python -m unittest discover -s tests -v
